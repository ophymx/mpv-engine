[package]
name = "mpv-engine"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Toolkit-agnostic libmpv embedding core: handle lifecycle, commands, typed events, and render seams."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ophymx/mpv-engine"
keywords = ["mpv", "libmpv", "video", "player"]
categories = ["multimedia::video"]

# Dependency policy: the default build must stay boring — libmpv bindings
# and std-adjacent utility crates only. No toolkit deps (gtk, iced, winit),
# no git deps (crates.io forbids them, and they'd re-couple us to exactly
# the churn this crate exists to contain). Planned non-default features
# (`egl`, `export`, `wgpu`) get their own entries when implemented — see
# README "Roadmap".

[features]
# Exported-frame render backend (macOS + Linux + Windows): the engine
# owns a hidden GL context on a dedicated render thread (CGL /
# surfaceless EGL over a DRM render node / WGL on an invisible window),
# renders into exportable framebuffers (IOSurface / DMA-BUF / shared
# D3D11 texture), and hands the shell zero-copy frame handles for Metal /
# Vulkan / D3D / wgpu import. Links the OpenGL, IOSurface and
# CoreFoundation frameworks (macOS), libEGL and libgbm (Linux), or
# opengl32, d3d11, dxgi, user32 and gdi32 (Windows) directly — no new
# Rust dependencies, per the policy above. On other platforms the feature
# compiles to nothing.
export = []
# Zero-copy import of ExportedFrame into wgpu (implies `export`; macOS →
# Metal, Linux → Vulkan via wgpu-hal's own dmabuf import, Windows → DX12
# via OpenSharedHandle).
# Non-default and wgpu-major-locked on purpose — releases carrying it
# track wgpu majors (the egui-wgpu pattern, see README), so core-only
# consumers never feel that churn. Needs Rust 1.87 (wgpu's MSRV).
wgpu = [
    "export",
    "dep:wgpu",
    "dep:wgpu-hal",
    "dep:ash",
    "dep:objc2",
    "dep:objc2-metal",
    "dep:objc2-io-surface",
    "dep:windows",
]

[dependencies]
libc = "0.2"
# rsmpv/rsmpv-sys are permissively licensed (MIT OR Apache-2.0 / ISC)
# clean-room bindings; the only copyleft in a consumer's tree is libmpv
# itself — see LICENSING.md. `render` pulls in the safe render.h wrapper
# the render seam is built on.
rsmpv = { version = "0.2", features = ["render"] }
parking_lot = "0.12"
thiserror = "2"
tracing = "0.1"

# wgpu with only the platform's native backend enabled: Vulkan on Linux,
# whose wgpu-hal carries the dmabuf import the Linux `wgpu` feature
# rides on (the Metal twin lives in the macOS section below).
[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan"], optional = true }
wgpu-hal = { version = "30", default-features = false, features = ["vulkan"], optional = true }
# The Linux wgpu import hand-rolls the dmabuf → VkImage import and wraps
# it via wgpu-hal's public `texture_from_raw` (with a DropCallback), so a
# consumed frame's pool buffer is *reused* rather than retired and
# reallocated per frame. No new crate enters the tree: wgpu-hal already
# depends on ash, and this must resolve to the *same* ash so the
# `vk::Image` types match — `30`'s wgpu-hal is on ash 0.38. Version-locked
# to wgpu like the rest of this feature (see the `wgpu` feature note).
ash = { version = "0.38", optional = true }

# The objc2 trio exists only to wrap an IOSurface in an MTLTexture on the
# consumer's device — the same generation of bindings wgpu-hal's Metal
# backend itself uses, so no second ObjC binding family enters the tree.
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal"], optional = true }
wgpu-hal = { version = "30", default-features = false, features = ["metal"], optional = true }
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3.2", optional = true, features = [
    "MTLAllocation",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "objc2-io-surface",
] }
objc2-io-surface = { version = "0.3.2", optional = true, features = [
    "objc2-core-foundation",
] }

# wgpu's DX12 backend plus the one `windows` interface the import needs
# (`ID3D12Device::OpenSharedHandle`) — the same generation of bindings
# wgpu-hal's own DX12 backend speaks, so no second Win32 binding family
# enters the tree. This is the objc2-trio arrangement, transposed.
[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["dx12"], optional = true }
wgpu-hal = { version = "30", default-features = false, features = ["dx12"], optional = true }
windows = { version = "0.62", default-features = false, optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
] }

[dev-dependencies]
tempfile = "3"
pollster = "0.4"
# Example-only (winit_player); dev-deps never reach consumers, so the
# no-toolkit-deps policy above is untouched.
winit = "0.30"

[[example]]
name = "winit_player"
required-features = ["wgpu"]

# Real-window lifecycle harness (resize / fullscreen / transport /
# teardown / back-to-back / multi-engine). Needs a display and a GPU, so
# it is a manual gate rather than a `tests/` binary.
[[example]]
name = "harness"
required-features = ["wgpu"]
