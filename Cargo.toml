[package]
name = "mpv-engine"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Toolkit-agnostic libmpv embedding core: handle lifecycle, commands, typed events, and render seams."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ophymx/mpv-engine"
keywords = ["mpv", "libmpv", "video", "player"]
categories = ["multimedia::video"]

# Dependency policy: the default build must stay boring — libmpv bindings
# and std-adjacent utility crates only. No toolkit deps (gtk, iced, winit),
# no git deps (crates.io forbids them, and they'd re-couple us to exactly
# the churn this crate exists to contain). Planned non-default features
# (`egl`, `export`, `wgpu`) get their own entries when implemented — see
# README "Roadmap".

[features]
# Exported-frame render backend (macOS today): the engine owns a hidden
# CGL context on a dedicated render thread, renders into IOSurface-backed
# framebuffers, and hands the shell zero-copy frame handles for Metal /
# wgpu import. Links the OpenGL, IOSurface and CoreFoundation frameworks
# directly — no new Rust dependencies, per the policy above. On other
# platforms the feature currently compiles to nothing (the Linux DMA-BUF
# analog is roadmap).
export = []
# Zero-copy import of ExportedFrame into wgpu (implies `export`; macOS →
# Metal today, the Linux → Vulkan half lands with the DMA-BUF tier).
# Non-default and wgpu-major-locked on purpose — releases carrying it
# track wgpu majors (the egui-wgpu pattern, see README), so core-only
# consumers never feel that churn. Needs Rust 1.87 (wgpu's MSRV).
wgpu = [
    "export",
    "dep:wgpu",
    "dep:wgpu-hal",
    "dep:objc2",
    "dep:objc2-metal",
    "dep:objc2-io-surface",
]

[dependencies]
libc = "0.2"
# rsmpv/rsmpv-sys are permissively licensed (MIT OR Apache-2.0 / ISC)
# clean-room bindings; the only copyleft in a consumer's tree is libmpv
# itself — see LICENSING.md. `render` pulls in the safe render.h wrapper
# the render seam is built on.
rsmpv = { version = "0.2", features = ["render"] }
parking_lot = "0.12"
thiserror = "2"
tracing = "0.1"
wgpu = { version = "30", default-features = false, features = ["metal"], optional = true }
wgpu-hal = { version = "30", default-features = false, features = ["metal"], optional = true }

# The objc2 trio exists only to wrap an IOSurface in an MTLTexture on the
# consumer's device — the same generation of bindings wgpu-hal's Metal
# backend itself uses, so no second ObjC binding family enters the tree.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3.2", optional = true, features = [
    "MTLAllocation",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "objc2-io-surface",
] }
objc2-io-surface = { version = "0.3.2", optional = true, features = [
    "objc2-core-foundation",
] }

[dev-dependencies]
tempfile = "3"
pollster = "0.4"
